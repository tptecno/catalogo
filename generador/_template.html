<style>

  header.top h1{margin:0;font-size:26px;letter-spacing:-.02em}

  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));

  .prod h2{margin:0 0 9px;font-size:15px;line-height:1.35;font-weight:650}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}

  .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .more{appearance:none;border:0;background:none;color:var(--muted);font-size:12.5px;

  details.full p{margin:8px 0 0;font-size:12.5px;color:#52525b;line-height:1.5}

  .empty{text-align:center;color:var(--muted);padding:44px 10px}

<script>
let   CAT      = "__CAT__";      // parser en uso
const DEFAULT_CAT = "__DEFAULT__";

const WA       = "5491135232818";

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const na =s=>/^#n\/a$/i.test((s||"").trim());
function sizeVal(c){ const n=parseFloat(c); return /TB/i.test(c)?n*1024:n; }
function normStore(s){
  const t=(s||"").toUpperCase().replace(/\s+/g,"");
  let m=t.match(/(\d+)TB/); if(m) return m[1]+" TB";
  m=t.match(/(\d+)GB/);     if(m) return m[1]+" GB";
  m=t.match(/(\d+)SSD/);    if(m) return m[1]+" GB";
  return "";
}

/* ---------- parser genérico (todas las pestañas menos Windows) ----------
   Todas comparten la misma forma: una fila de encabezado con "Precio USD",
   la descripción en la columna de al lado, y arriba una fila con el título
   del bloque. Las columnas de CODIGO y Precio ARS quedan afuera.          */
function parseGeneric(rows){
  const groups=[]; let g=null, pIdx=-1, dIdx=-1, cIdx=-1, label="", pend="";
  const blank=r=>r.every(c=>!(c||"").trim());
  const cells=r=>r.map(c=>(c||"").trim());
  for(const raw of rows){
    const r=cells(raw);
    if(blank(raw)){ g=null; continue; }
    const p=r.findIndex(c=>/^precio\s*(usd|u\$s)$/i.test(c));
    if(p>-1){                                   // fila de encabezado
      pIdx=p; cIdx=r.findIndex(c=>/^colores$/i.test(c));
      dIdx=-1;
      for(let j=p-1;j>=0;j--) if(r[j]){ dIdx=j; break; }
      label=dIdx>-1?r[dIdx]:"";
      g={name:pend||"", colors:[], items:[], label};
      groups.push(g); continue;
    }
    const filled=r.filter(Boolean);
    if(filled.length===1 && pIdx===-1 || (filled.length===1 && !g)){ pend=filled[0]; continue; }
    if(filled.length===1){ pend=filled[0]; g=null; continue; }   // título del próximo bloque
    if(!g || pIdx===-1) continue;
    if(cIdx>-1 && (raw[cIdx]||"").trim())
      g.colors=(raw[cIdx]||"").split("\n").map(x=>x.trim()).filter(Boolean);
    const desc=(raw[dIdx]||"").trim(), price=(raw[pIdx]||"").trim();
    if(!desc || !price || na(desc) || /^#(ref|value)/i.test(price)) continue;
    // "1TB GB" y "512 GB " son solo capacidad: se muestran normalizados.
    // "256 GB - WiFi + Cell" lleva más datos, se deja tal cual.
    const soloCap=/^\s*\d+\s*(GB|TB)(\s*GB)?\s*$/i.test(desc);
    g.items.push({model:g.name, colors:g.colors,
                  desc:(soloCap?normStore(desc):desc).replace(/\s+/g," "),
                  price, avail:!na(price) && !/ingresando|consultar/i.test(price)});
  }
  const items=[];
  groups.forEach(gr=>gr.items.forEach(i=>{ i.colors=gr.colors; items.push(i); }));
  return {items, groups, label:(groups[0]||{}).label||""};
}

/* Si la columna que describe la variante tiene pocos valores y son cortos
   (Capacidad, Tamaño…), se convierte sola en filtro de chips. Si son largos
   o hay demasiados (nombres de producto), la categoría va sin filtro.      */
function autoFiltro(d){
  const cap=/^\d+\s*(GB|TB)/i;
  d.items.forEach(i=> i.autoval = i.desc);
  let v=[...new Set(d.items.map(i=>i.autoval).filter(Boolean))];

  // Si la mayoría de los valores son capacidades, el filtro se arma solo con esas
  // (así el bloque de accesorios del final de iPhone no ensucia los chips de GB).
  const caps=v.filter(x=>cap.test(x));
  if(caps.length>=v.length/2) v=caps;

  // Valores todos distintos = son nombres de producto, no un atributo: no sirve filtrar.
  const compartido = d.items.filter(i=>v.includes(i.autoval)).length / v.length;
  const ok = v.length>=2 && v.length<=12 && compartido>=1.5 && !v.some(x=>x.length>24);

  if(ok){
    const capLike=v.every(x=>/^\d+\s*(GB|TB)$/i.test(x));
    const capIni=v.every(x=>cap.test(x));   // "256 GB - WiFi + Cell"
    return [{key:"autoval",
             label:capLike?"Almacenamiento":capIni?"Capacidad":(d.label||"Opciones"),
             values:v, sort:capLike?((a,b)=>sizeVal(a)-sizeVal(b)):undefined}];
  }
  // Último intento: si toda variante arranca con la capacidad (iPad: "256 GB - WiFi + Cell"),
  // se filtra por capacidad aunque el texto completo sea largo.
  if(v.length && v.every(x=>cap.test(x))){
    d.items.forEach(i=> i.autoval = cap.test(i.desc) ? normStore(i.desc) : "");
    const w=[...new Set(d.items.map(i=>i.autoval).filter(Boolean))];
    if(w.length>=2 && w.length<=12)
      return [{key:"autoval", label:"Almacenamiento", values:w,
               sort:(a,b)=>sizeVal(a)-sizeVal(b)}];
  }
  return [];
}

/* ---------- MacBook: filtros propios ---------- */
function enrichMac(d){
  d.items.forEach(i=>{
    const spec=i.desc, m=i.model;
    i.linea = /\bAir\b/i.test(m) ? "MacBook Air"
            : /\bPro\b/i.test(m) ? "MacBook Pro"
            : /\bNeo\b/i.test(m) ? "MacBook Neo" : m;
    const tam  = (m.match(/(\d{2}(?:\.\d)?)\s*"/)||[])[1];
    const chip = (spec.match(/^(M\d\s*(?:Pro|Max)?|A\d+\s*Pro?)/i)||[])[1];
    const ram  = (spec.match(/(\d+)\s*GB\s*-/i)||[])[1];
    i.tam  = tam?tam+'"':"";
    i.chip = chip?chip.replace(/\s+/g," ").trim():"";
    i.ram  = ram?ram+" GB":"";
    i.ssd  = normStore(spec.split("-").pop()||"");
    i.desc = spec.replace(/\s*-\s*/g," · ");
  });
  return [
    {key:"linea", label:"Línea"},
    {key:"tam",   label:"Tamaño",         sort:(a,b)=>parseFloat(a)-parseFloat(b)},
    {key:"chip",  label:"Chip"},
    {key:"ram",   label:"RAM",            sort:(a,b)=>parseInt(a)-parseInt(b)},
    {key:"ssd",   label:"Almacenamiento", sort:(a,b)=>sizeVal(a)-sizeVal(b)}
  ];
}

/* ---------- Windows ---------- */
function parseWin(rows){
  const items=[]; let marca="", tipo="Notebook", cur=null;
  const push=()=>{ if(cur) items.push(cur); cur=null; };
  for(const r of rows){
    const a=(r[0]||"").trim(), price=(r[1]||"").trim(), stk=(r[2]||"").trim();
    if(!a) continue;
    // encabezado de marca: celda sola, en mayúsculas, sin precio
    if(!price && a===a.toUpperCase() && a.length<28 && !/[:.]/.test(a)){
      push();
      const t = /GAMER/.test(a) ? "Gamer"
              : /ALL IN ONE/.test(a) ? "All in One"
              : /MONITOR/.test(a) ? "Monitor" : "Notebook";
      marca = a.replace(/\s*(GAMER|ALL IN ONE|MONITOR.*)$/,"").trim();
      tipo  = t; continue;
    }
    if(price){                                   // fila de producto
      push();
      cur={ marca, tipo, name:a.replace(/\s+/g," ").trim(), price,
            avail: stk.toUpperCase()==="STK", stk, specs:[] };
      continue;
    }
    if(cur) cur.specs.push(a);                   // filas de specs
  }
  push();
  return {items: items.map(p=>{
    const s=p.specs.join(" ");
    const ram=(s.match(/Memory[:;]?\s*(\d+)\s*GB/i)||[])[1];
    // el proveedor escribe "Storage:" y a veces "Storage;" — y algún equipo no lo trae
    const st =(s.match(/Storage[:;]?\s*(\d+)\s*(TB|GB)/i)
            || s.match(/(\d+)\s*(TB|GB)\s*(?:M\.2|SSD|PCIe|Solid State)/i) || []);
    const scr=(p.name.match(/(\d{2}(?:\.\d)?)\s*"/)||s.match(/Display:\s*(\d{2}(?:\.\d)?)\s*"/)||[])[1];
    const gpu=(s.match(/(RTX\s*\d{4}\s*(?:Ti)?|GTX\s*\d{4}|Radeon\s*RX\s*\d+)/i)||[])[1];
    return {...p,
      ram: ram?ram+" GB":"",
      ssd: st[1]?st[1]+" "+st[2].toUpperCase():"",
      pantalla: scr?scr+'"':"",
      gpu: gpu?gpu.replace(/\s+/g," ").toUpperCase():"",
      graficos: gpu?"Placa dedicada":"Gráficos integrados",
      disponible: p.avail?"Con stock":"A pedido",
      spec: s.replace(/\s+/g," ").trim()
    };
  }), style:"selects", group:"marca", filters:[
    {key:"tipo",      label:"Tipo"},
    {key:"marca",     label:"Marca"},
    {key:"ram",       label:"RAM",             sort:(a,b)=>parseInt(a)-parseInt(b)},
    {key:"ssd",       label:"Almacenamiento",  sort:(a,b)=>sizeVal(a)-sizeVal(b)},
    {key:"pantalla",  label:"Pantalla",        sort:(a,b)=>parseFloat(a)-parseFloat(b)},
    {key:"graficos",  label:"Gráficos"},
    {key:"disponible",label:"Disponibilidad"}
  ]};
}

/* ---------- motor ---------- */
let DATA={items:[],filters:[]}, sel={}, onlyStock=false;

function values(f, base){
  let v=[...new Set(base.map(i=>i[f.key]).filter(Boolean))];
  if(f.values) v=v.filter(x=>f.values.includes(x));
  return f.sort ? v.sort(f.sort) : v.sort();
}
function matches(i, skip){
  for(const f of DATA.filters){
    if(f.key===skip) continue;
    if(sel[f.key] && i[f.key]!==sel[f.key]) return false;
  }
  return !(onlyStock && !i.avail);
}
function visible(){ return DATA.items.filter(i=>matches(i,null)); }

function buildFilters(){
  const box=document.getElementById("filters");
  if(DATA.style==="chips"){
    const f=DATA.filters[0];
    box.innerHTML=`<p class="flabel">${f.label}</p><div class="chips" id="chips"></div>
      <div class="bar"><span class="count" id="count"></span></div>`;
    const c=document.getElementById("chips");
    c.innerHTML=[`<button class="chip" data-v="" aria-pressed="true">Todos</button>`]
      .concat(values(f,DATA.items).map(v=>`<button class="chip" data-v="${esc(v)}">${esc(v)}</button>`)).join("");
    c.addEventListener("click",e=>{
      const b=e.target.closest(".chip"); if(!b) return;
      sel[f.key]=b.dataset.v||null;
      [...c.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
      render();
    });
  }else{
    box.innerHTML=`<div class="selects">${DATA.filters.map(f=>
      `<div class="fld"><label for="s_${f.key}">${f.label}</label>
        <select id="s_${f.key}" data-k="${f.key}"></select></div>`).join("")}</div>
      <div class="bar"><span class="count" id="count"></span>
        <button class="clear" id="clear">Limpiar filtros</button></div>`;
    box.addEventListener("change",e=>{
      const s=e.target.closest("select"); if(!s) return;
      sel[s.dataset.k]=s.value||null; render();
    });
    document.getElementById("clear").addEventListener("click",()=>{ sel={}; render(); });
  }
  render();
}
function syncSelects(){
  for(const f of DATA.filters){
    const s=document.getElementById("s_"+f.key); if(!s) continue;
    const base=DATA.items.filter(i=>matches(i,f.key));
    const opts=values(f,base);
    if(sel[f.key] && !opts.includes(sel[f.key])) opts.push(sel[f.key]);
    s.innerHTML=`<option value="">Todos</option>`+
      opts.map(v=>`<option value="${esc(v)}"${sel[f.key]===v?" selected":""}>${esc(v)}</option>`).join("");
    s.classList.toggle("on", !!sel[f.key]);
  }
  const any=Object.values(sel).some(Boolean);
  const c=document.getElementById("clear"); if(c) c.style.display=any?"inline":"none";
}

function render(){
  if(DATA.style==="selects") syncSelects();
  const vis=visible();
  const cnt=document.getElementById("count");
  if(cnt) cnt.textContent=`${vis.length} ${vis.length===1?"equipo":"equipos"}`;
  const list=document.getElementById("list");
  if(!vis.length){
    list.innerHTML='<div class="empty">No hay equipos con esa combinación.<br>Escribinos y te lo conseguimos.</div>';
    return;
  }
  list.innerHTML = CAT==="win" ? renderWin(vis) : renderGrouped(vis);
}
function waLink(txt){ return `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`; }

function renderGrouped(vis){
  const key = DATA.group || "model";
  // El estilo de fila se decide por categoría, no por fila: o son todas variantes
  // cortas (256 GB) o son todas nombres de producto. Mezclarlo se ve desprolijo.
  const corta = DATA.items.filter(i=>i.desc.length<16).length > DATA.items.length*0.8;
  // Categorías donde la variante es directamente el nombre del producto (AirPods, DJI…)
  const nombre = !corta && DATA.items.every(i=>!/\d+\s*(GB|TB)|core/i.test(i.desc));
  const groups=[]; const idx={};
  vis.forEach(i=>{ const k=i[key];
    if(!(k in idx)){ idx[k]=groups.length; groups.push({k, colors:i.colors||[], items:[]}); }
    groups[idx[k]].items.push(i); });
  return groups.map(g=>`
    <section class="model">
      <h2>${esc(g.k)}</h2>
      ${g.colors.length?`<div class="colors"><b>Colores:</b> ${g.colors.map(esc).join(" · ")}</div>`:""}
      ${g.items.map(i=>`
        <div class="row${corta?"":" long"}">
          <span class="${corta?"cap":"spec"+(nombre?" name":"")}">${esc(i.desc)}</span>
          ${i.avail
            ? `<span class="price">${esc(i.price)}</span>
               <a class="wa" target="_blank" rel="noopener" href="${waLink(
                 `Hola! Me interesa el ${i.model} ${i.desc} — ${i.price}`)}">Consultar</a>`
            : `<span class="soon">${esc(i.estado || "Sin stock")}</span>`}
        </div>`).join("")}
    </section>`).join("");
}

function renderWin(vis){
  const groups=[]; const idx={};
  vis.forEach(i=>{ const k=i.marca+(i.tipo!=="Notebook"?" · "+i.tipo:"");
    if(!(k in idx)){ idx[k]=groups.length; groups.push({k,items:[]}); }
    groups[idx[k]].items.push(i); });
  return groups.map(g=>`
    <div class="group"><h3>${esc(g.k)}</h3>
    ${g.items.map(p=>`
      <article class="prod">
        <h2>${esc(p.name)}</h2>
        <div class="pills">
          ${p.ram?`<i>${esc(p.ram)} RAM</i>`:""}
          ${p.ssd?`<i>${esc(p.ssd)} SSD</i>`:""}
          ${p.pantalla?`<i>${esc(p.pantalla)}</i>`:""}
          ${p.gpu?`<i class="gpu">${esc(p.gpu)}</i>`:""}
        </div>
        <div class="foot">
          ${p.avail
            ? `<span class="price" style="margin-left:0">${esc(p.price)}</span>
               <a class="wa" target="_blank" rel="noopener"
                  href="${waLink(`Hola! Me interesa la ${p.name} — ${p.price}`)}">Consultar</a>`
            : `<span class="soon" style="margin-left:0">Sin stock · consultar ingreso</span>`}
        </div>
        ${p.spec?`<details class="full"><summary>Ver ficha completa</summary><p>${esc(p.spec)}</p></details>`:""}
      </article>`).join("")}
    </div>`).join("");
}

/* ---------- categorías ---------- */
const CATS = __CATS__;
const CACHE = {};

const HAY_PORTADA = !DEFAULT_CAT;      // solo el catálogo general abre en portada
function catActual(){
  const h=(location.hash||"").replace("#","").toLowerCase();
  const c=CATS.find(x=>x.key===h);
  if(c) return c;
  if(HAY_PORTADA) return null;         // sin categoría en la URL: portada
  return CATS.find(x=>x.key===DEFAULT_CAT) || CATS[0];
}

function portada(){
  document.getElementById("titulo").parentElement.style.display="none";
  document.getElementById("filters").innerHTML="";
  document.title="Catálogo tptecno";
  document.getElementById("list").innerHTML=`
    <div class="marca">
      <img src="tp-180.png" alt="tptecno">
      <h1>Catálogo tptecno</h1>
      <p>Elegí una categoría para ver modelos, precios y disponibilidad.</p>
    </div>
    <div class="rejilla">
      ${CATS.map(c=>`<a href="#${c.key}"><b>${esc(c.label)}</b>
         <span>${c.n} ${c.n===1?"producto":"productos"}</span></a>`).join("")}
    </div>
    <p class="aviso">Enviamos en el día 🛵 · Efectivo / USD · Transferencia +3% · Crypto +2%<br>
      Consultá por modelos o configuraciones que no figuren.</p>`;
}
function pintarNav(act){
  const n=document.getElementById("cats");
  if(CATS.length<2){ n.style.display="none"; return; }
  const inicio = HAY_PORTADA ? `<a href="#" class="${act?"":"on"}">Inicio</a>` : "";
  n.innerHTML=inicio+CATS.map(c=>
    `<a href="#${c.key}" class="${act&&c.key===act.key?"on":""}">${esc(c.label)}</a>`).join("");
  if(!act){ n.scrollLeft=0; return; }        // en la portada, la barra arranca al principio
  const on=n.querySelector("a.on");
  if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}

async function traer(cat){
  if(CACHE[cat.key]) return CACHE[cat.key];

  // Categorías que salen de la planilla de costos: los datos ya vienen armados
  // desde el generador, porque esa planilla es privada y el navegador no la puede leer.
  if(cat.mode==="json"){
    const d={items:JSON.parse(document.getElementById("datos-"+cat.key).textContent),
             label:cat.filtro||""};
    d.style="chips"; d.group="model";
    d.filters = cat.parser==="mac" ? enrichMac(d)
              : cat.grupo ? [{key:"model", label:cat.grupo}]   // el bloque es la marca
              : autoFiltro(d);
    if(d.filters.length>2) d.style="selects";
    return CACHE[cat.key]=d;
  }

  let text=null;
  try{ const r=await fetch(cat.url,{cache:"no-store"}); if(r.ok) text=await r.text(); }catch(e){}
  let local=false;
  if(!text){
    const el=document.getElementById("csv-"+cat.key);
    if(el){ text=el.textContent; local=true; }
  }
  if(!text) return null;
  const s=document.getElementById("stale");
  s.style.display = local ? "block" : "none";
  if(local) s.textContent="Vista de prueba: no se pudo leer la planilla en vivo (pasa al abrir el archivo local). Se muestran los datos de la última copia.";
  const rows=parseCSV(text);
  let d;
  if(cat.parser==="win"){ d=parseWin(rows); }
  else{
    d=parseGeneric(rows);
    d.style="chips"; d.group="model";
    d.filters = cat.parser==="mac" ? enrichMac(d) : autoFiltro(d);
    if(d.filters.length>2) d.style="selects";
  }
  CACHE[cat.key]=d;
  return d;
}

async function mostrar(){
  const cat=catActual();
  pintarNav(cat);
  if(!cat){ portada(); return; }
  document.getElementById("titulo").parentElement.style.display="";
  document.getElementById("titulo").textContent=cat.label;
  document.title="Catálogo "+cat.label+" · tptecno";
  sel={};
  document.getElementById("filters").innerHTML="";
  document.getElementById("list").innerHTML='<div class="loading">Cargando…</div>';
  const d=await traer(cat);
  if(!d){ document.getElementById("list").innerHTML=
    '<div class="empty">No se pudo cargar esta categoría. Probá de nuevo en un momento.</div>'; return; }
  DATA=d; CAT=cat.parser;
  if(!DATA.filters.length){
    document.getElementById("filters").innerHTML="";
    render();
  }else buildFilters();
}
window.addEventListener("hashchange",mostrar);
mostrar();
</script>
